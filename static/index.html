<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCRM Dashboard - NLPQuery</title>
    <!-- Add cache-busting to CSS -->
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Rail Nav -->
        <nav class="rail-nav">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
            </div>
            <div class="nav-icons">
                <button class="nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></button>
                <button class="nav-btn" onclick="window.location.href='coming-soon.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></button>
                <button class="nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg></button>
                <button class="nav-btn active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
            </div>
            <div class="bottom-icons">
                <button class="nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
                <!-- <button class="nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg></button>-->
                <button class="nav-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
            </div>
        </nav>

        <!-- History Panel -->
        <aside class="history-sidebar">
            <div class="history-header-top">
                <h2>Conversation</h2>
                <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></button>
            </div>
            
            <div class="history-content">
                <div class="section-title">
                    <span>Recent</span>
                    <button class="clear-btn" onclick="clearHistory()">Clear</button>
                </div>
                <div id="history-list" class="history-list">
                    <!-- populated by JS -->
                </div>
            </div>

            <div class="history-footer">
                <button class="btn-outline" id="open-db-modal-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                    <span id="db-status-text">Connect DB</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="search-container">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <input type="text" placeholder="Search tables or data...">
                </div>
                <div class="top-bar-actions">
                    <!-- <div class="avatar-small"><img src="https://ui-avatars.com/api/?name=User&background=f3f4f6&color=000" alt="User"></div>-->
                    <button class="icon-btn btn-plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
                    <button class="icon-btn btn-bell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>
                </div>
            </header>

            <div class="chat-wrapper">
                <div class="chat-subheader">
                    <div class="custom-dropdown" id="model-dropdown">
                        <div class="dropdown-selected">
                            <span id="selected-model-text">Nemotron 4 340B</span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="chevron"><path d="M6 9l6 6 6-6"/></svg>
                        </div>
                        <div class="dropdown-options hidden" id="dropdown-options">
                            <div class="dropdown-option selected" data-value="nvidia/nemotron-4-340b-instruct">Nemotron 4 340B</div>
                            <div class="dropdown-option" data-value="nvidia/nemotron-mini-4b-instruct">Nemotron Mini 4B</div>
                            <div class="dropdown-option" data-value="nvidia/nemotron-3-nano-30b-a3b">Nemotron 3 30B</div>
                            <div class="dropdown-option" data-value="meta/llama-3.1-70b-instruct">Llama 3.1 70B</div>
                        </div>
                    </div>
                    <button class="btn-primary-pill" onclick="location.reload()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                        New Chat
                    </button>
                </div>

                <div class="chat-container" id="chat-container">
                    <!-- Messages go here -->
                </div>

                <div class="input-area-wrapper">
                    <div class="input-box">
                        <div class="input-top">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="sparkle-icon"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                            <input type="text" id="question" placeholder="Ask me anything..." autocomplete="off">
                        </div>
                        <div class="input-bottom">
                            <div class="left-actions">
                                <div class="dropdown-pill">
                                    Select Source 
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                                </div>
                            </div>
                            <div class="right-actions">
                                <button class="action-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg> Attach</button>
                                <button class="action-pill" id="voice-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> Voice</button>
                                <button class="btn-primary" id="send-btn">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="send-icon"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                                    Send
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="input-footer">
                        <span id="msg-count">0 messages</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- DB Connect Modal -->
<div class="modal-overlay hidden" id="db-modal">

    <div class="modal-content">

        <div class="modal-header">
            <h2>Connect Database</h2>
            <button id="close-db-modal">&times;</button>
        </div>

        <div class="db-form">

            <select id="db-engine">
                <option value="postgres">PostgreSQL</option>
                <option value="oracle">Oracle</option>
            </select>

            <input type="text" id="db-host" placeholder="Host (localhost)" value="localhost">
            <input type="number" id="db-port" placeholder="Port" value="5432">
            <input type="text" id="db-name" placeholder="Database Name">
            <input type="text" id="db-user" placeholder="Username">
            <input type="password" id="db-password" placeholder="Password">

            <button id="connect-db-btn" class="btn-primary w-full">
                Connect
                <span class="spinner hidden" id="db-spinner"></span>
            </button>

            <p id="db-error" class="error-text hidden"></p>

        </div>

    </div>

</div>

    <script src="script.js?v=4"></script>
</body>
</html>
